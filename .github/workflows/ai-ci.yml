name: AI CI

on:
  push:
    branches: [main]
    paths:
      - "applications/ai/api-services/**"
  pull_request:
    branches: [main]
    paths:
      - "applications/ai/api-services/**"

jobs:
  build:
    name: Build & Sail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/ai/api-services

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/ai/api-services/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    name: SAIL AI API
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Sail
        run: |
          curl -s --fail -X POST "${{ secrets.SAIL2 }}"
