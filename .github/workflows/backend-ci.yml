name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "applications/web/backend/**"
  pull_request:
    branches: [main]
    paths:
      - "applications/web/backend/**"

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/web/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/web/backend/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  deploy:
    name: SAIL
    needs: build
    runs-on: ubuntu-latest
    # only SAIL on push event on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger SAIL
        run: |
          curl -s --fail -X POST "${{ secrets.SAIL }}"
