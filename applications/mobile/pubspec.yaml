name: citypulse
description: CityPulse - Smart Parking & Traffic Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2

  # Networking
  http: ^1.1.2

  # Utilities
  intl: ^0.18.1

  # Google Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  location: ^6.0.0
  flutter_polyline_points: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#18D6C0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"