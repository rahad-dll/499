# YOLOv8n with a ResNet-18 backbone  (paper §5.4)
#
# Differs from the authors' committed YAML by the `scales:` block below, which is required to
# reproduce Table 4 (13.32 M params / 132 layers / 35.2 GFLOPs). Without it Ultralytics builds
# the neck at depth=width=1.0 and you get 51.4 M / 164 L / 122.2 GFLOPs.  See PAPER_NOTES.md §7.1.
#
# Verified locally (ultralytics 8.3.100, nc=2): 13.33 M params, 132 layers, 35.2 GFLOPs.

nc: 2 # overridden by data.yaml at train time

scales: # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  # TorchVision(c2, name, weights, unwrap, truncate, split) -> list of every intermediate output,
  # y[0] = input, y[i] = output of sub-module i-1. truncate=2 drops avgpool + fc.
  - [-1, 1, TorchVision, [2048, "resnet18", "DEFAULT", True, 2, True]] # 0
  - [0, 1, Index, [128, 6]] # 1  layer2 -> (128, 80, 80)   P3/8
  - [0, 1, Index, [256, 7]] # 2  layer3 -> (256, 40, 40)   P4/16
  - [0, 1, Index, [512, 8]] # 3  layer4 -> (512, 20, 20)   P5/32
  - [-1, 1, SPPF, [1024, 5]] # 4

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 5
  - [[-1, 2], 1, Concat, [1]] # 6  cat backbone P4
  - [-1, 3, C2f, [512]] # 7

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 8
  - [[-1, 1], 1, Concat, [1]] # 9  cat backbone P3
  - [-1, 3, C2f, [256]] # 10 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 11
  - [[-1, 7], 1, Concat, [1]] # 12 cat head P4
  - [-1, 3, C2f, [512]] # 13 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat head P5
  - [-1, 3, C2f, [1024]] # 16 (P5/32-large)

  - [[10, 13, 16], 1, Detect, [nc]] # 17 Detect(P3, P4, P5)
